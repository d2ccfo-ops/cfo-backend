services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cfoos
      POSTGRES_PASSWORD: cfoos
      POSTGRES_DB: cfoos
    ports:
      - "5432:5432"
    volumes:
      - cfoos_pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  cfoos_pg_data:
